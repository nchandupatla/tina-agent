<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" role="img" aria-label="TINA mascot: a smiling cloud whose right eye is a blinking cursor">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="20" y1="18" x2="180" y2="128">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <style>
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
  <g fill="url(#sky)">
    <rect x="28" y="72" width="146" height="52" rx="26"/>
    <circle cx="70" cy="78" r="34"/>
    <circle cx="116" cy="62" r="44"/>
    <circle cx="152" cy="88" r="27"/>
  </g>
  <circle cx="88" cy="90" r="8" fill="#0B1020"/>
  <rect class="blink" x="118" y="80" width="12" height="20" rx="2" fill="#0B1020"/>
  <path d="M95 106 Q108 117 121 106" fill="none" stroke="#0B1020" stroke-width="5" stroke-linecap="round"/>
  <circle cx="72" cy="104" r="6" fill="#F9A8D4"/>
  <circle cx="142" cy="104" r="6" fill="#F9A8D4"/>
</svg>
